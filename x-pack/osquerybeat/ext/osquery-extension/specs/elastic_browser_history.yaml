type: table
name: elastic_browser_history
description: Query browser history from multiple browsers with a unified schema
platforms: [linux, darwin, windows]

# Implementation package - keeps generated and implementation packages decoupled
# The implementation package should have an init() that registers with the generated package
implementation_package: github.com/elastic/beats/v7/x-pack/osquerybeat/ext/osquery-extension/pkg/browserhistory

columns:
  # Universal fields (available across all browsers)
  - name: timestamp
    type: BIGINT
    description: Unix timestamp in seconds since epoch (visit time)
    go_type: time.Time
    format: unix

  - name: datetime
    type: TEXT
    description: Human-readable datetime string in RFC3339 format (visit time)
    go_type: time.Time
    format: rfc3339
    timezone: UTC

  - name: url_id
    type: BIGINT
    description: Unique URL identifier within the browser profile

  - name: scheme
    type: TEXT
    description: URL scheme/protocol (e.g., "https", "http", "file", "ftp")

  - name: domain
    type: TEXT
    description: Registrable domain (eTLD+1) extracted from hostname (e.g., "github.com", "google.com", "example.co.uk")

  - name: hostname
    type: TEXT
    description: Full hostname from URL (e.g., "www.github.com", "mail.google.com")

  - name: url
    type: TEXT
    description: Full URL visited

  - name: title
    type: TEXT
    description: Page title

  - name: browser
    type: TEXT
    description: Browser name (chrome, edge, firefox, safari, brave)

  - name: parser
    type: TEXT
    description: Parser used to extract the history

  - name: user
    type: TEXT
    description: Username/profile owner

  - name: profile_name
    type: TEXT
    description: Browser profile name

  - name: transition_type
    type: TEXT
    description: Navigation method - how user reached this page (TYPED, LINK, BOOKMARK, RELOAD, REDIRECT, etc.)

  - name: referring_url
    type: TEXT
    description: URL that linked to this page (if navigated via link)

  - name: visit_id
    type: BIGINT
    description: Unique visit identifier

  - name: from_visit_id
    type: BIGINT
    description: Visit ID that led to this visit (navigation chain)

  - name: visit_source
    type: TEXT
    description: Data origin - where this visit data came from (browsed/local, synced, imported, extension)

  - name: is_hidden
    type: INTEGER
    description: Whether visit is hidden (1) or visible (0)
    go_type: bool

  - name: history_path
    type: TEXT
    description: Path to the browser history database file

  # Chromium-specific fields (Chrome, Edge, Brave, etc.)
  - name: ch_visit_duration_ms
    type: BIGINT
    description: Duration of visit in milliseconds (Chromium-based browsers only)

  # Firefox-specific fields
  - name: ff_session_id
    type: INTEGER
    description: Firefox session tracking identifier

  - name: ff_frecency
    type: INTEGER
    description: Firefox frecency score (frequency + recency algorithm)

  # Safari-specific fields
  - name: sf_domain_expansion
    type: TEXT
    description: Safari domain classification/expansion

  - name: sf_load_successful
    type: INTEGER
    description: Whether page loaded successfully (1) or failed (0)
    go_type: bool

  - name: custom_data_dir
    type: TEXT
    description: Custom data directory path (for querying non-standard locations)

documentation:
  description: |
    Query browser history from multiple browsers (Chrome, Edge, Firefox, Safari) with a unified schema.
    
    Supports automatic discovery from standard profile locations on Linux, macOS, and Windows.
    Can also query custom directories for forensics, backups, or mounted drives using the custom_data_dir constraint.
    
    Returns one row per visit with detailed navigation information including timestamps, URLs, transition types,
    and browser-specific metadata.
    
    ## Supported Browsers
    
    - **Chrome**: Linux, macOS, Windows
    - **Edge**: Linux, macOS, Windows  
    - **Firefox**: Linux, macOS, Windows
    - **Safari**: macOS only
    
    ## Auto-Discovery
    
    The table automatically discovers browsers from standard user profile locations:
    
    **Linux**:
    - Chrome: `~/.config/google-chrome/`
    - Edge: `~/.config/microsoft-edge/`
    - Firefox: `~/.mozilla/firefox/`
    
    **macOS**:
    - Chrome: `~/Library/Application Support/Google/Chrome/`
    - Edge: `~/Library/Application Support/Microsoft Edge/`
    - Firefox: `~/Library/Application Support/Firefox/`
    - Safari: `~/Library/Safari/`
    
    **Windows**:
    - Chrome: `%LOCALAPPDATA%\Google\Chrome\User Data\`
    - Edge: `%LOCALAPPDATA%\Microsoft\Edge\User Data\`
    - Firefox: `%APPDATA%\Mozilla\Firefox\`
    
    ## Custom Data Directories
    
    Use the `custom_data_dir` constraint to query non-standard locations:
    
    ```sql
    -- Query from backup
    SELECT * FROM elastic_browser_history 
    WHERE custom_data_dir = '/mnt/backup/Users/john/AppData/Local/Google';
    
    -- Query with glob pattern
    SELECT * FROM elastic_browser_history 
    WHERE custom_data_dir GLOB '/forensics/users/*/Library/Application Support/Google';
    ```
    
    ## Field Distinction
    
    **transition_type** = HOW the user navigated (navigation method)  
    **visit_source** = WHERE the visit data originated (data provenance)
    
    Example: `transition_type = 'TYPED'` and `visit_source = 'synced'` means the user typed the URL on another device.
    
    ## Browser-Specific Fields
    
    - **Chromium fields** (`ch_*`): Only populated for Chrome, Edge, Brave
    - **Firefox fields** (`ff_*`): Only populated for Firefox
    - **Safari fields** (`sf_*`): Only populated for Safari
    - Universal fields are always populated regardless of browser

  examples:
    - title: Get all browser history
      query: SELECT * FROM elastic_browser_history;

    - title: Get history from specific browser
      query: SELECT * FROM elastic_browser_history WHERE browser = 'chrome';

    - title: Recent history (last 7 days)
      query: |
        SELECT url, title, browser, datetime 
        FROM elastic_browser_history 
        WHERE timestamp > (strftime('%s', 'now') - 604800)
        ORDER BY timestamp DESC;

    - title: Search for specific domains (registrable domain)
      query: |
        SELECT browser, profile_name, url, title, datetime
        FROM elastic_browser_history
        WHERE domain = 'github.com'
        ORDER BY timestamp DESC;

    - title: Most visited domains
      query: |
        SELECT domain, COUNT(*) as visits
        FROM elastic_browser_history
        WHERE domain != ''
        GROUP BY domain
        ORDER BY visits DESC
        LIMIT 20;

    - title: Find typed URLs (direct user navigation)
      query: |
        SELECT url, title, browser, datetime
        FROM elastic_browser_history
        WHERE transition_type LIKE '%TYPED%'
        ORDER BY timestamp DESC;

    - title: Query from custom directory
      query: |
        SELECT * FROM elastic_browser_history 
        WHERE custom_data_dir = '/mnt/backup/Users/john/Library/Application Support/Google';

    - title: Analyze navigation methods
      query: |
        SELECT transition_type, COUNT(*) as count
        FROM elastic_browser_history
        GROUP BY transition_type
        ORDER BY count DESC;

    - title: Most visited hostnames
      query: |
        SELECT hostname, COUNT(*) as visits
        FROM elastic_browser_history
        WHERE hostname != ''
        GROUP BY hostname
        ORDER BY visits DESC
        LIMIT 20;

    - title: Find non-HTTPS visits (security audit)
      query: |
        SELECT browser, url, title, datetime
        FROM elastic_browser_history
        WHERE scheme IN ('http', 'ftp')
        ORDER BY timestamp DESC;

  notes:
    - "Automatically discovers browsers from standard user profile locations"
    - "Supports Chrome, Edge, Firefox (all platforms) and Safari (macOS only)"
    - "Use custom_data_dir constraint to query non-standard locations for forensics or backups"
    - "Returns one row per visit with detailed navigation metadata"
    - "Browser-specific fields (ch_*, ff_*, sf_*) only populated for respective browsers"
    - "Requires read access to browser profile directories"
    - "url_id is unique within a browser profile and used for grouping visits to the same URL"
    - "Use timestamp filters to improve performance on large history databases"
    - "transition_type shows HOW user navigated (method), visit_source shows WHERE data originated (provenance)"
    - "domain field contains registrable domain (eTLD+1), hostname contains full hostname"

  related_tables:
    - users
    - logged_in_users
    - processes
    - file
    - hash
